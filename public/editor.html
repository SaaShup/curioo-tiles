<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tile Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css" integrity="sha384-weDCJ80JNrg6W2Dha8CBrQyz5PZVPOZ39Lw7vWOzm65zqKvZZfSq/3rR77RY5TWm" crossorigin="anonymous"></link>
  <script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js" integrity="sha384-Kigx+fLsY5TWX5hU/QUxy7tQh2bUzeIuoHUZTj2O056ByEtnhW6gi9ib8h6r5yb8" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>

<body>
  <div class="page">
    <div class="section">
    <div class="header-row">
      <a class="eyebrow" href="/">
        🗺️ Tile theme index
      </a>

      <div id="authBox">
        <a href="/api/login" class="btn secondary login-btn">
          🔐 Login
        </a>
      </div>
    </div>

      <h1>🎨 Tile Editor</h1>

      <p class="lead">Edit map colors, preview them, then save your theme.</p>

      <div class="topbar">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect"></select>
        <button id="previewBtn" onclick="previewTheme()" class="btn secondary" style="display:none">Preview</button>
        <button id="saveBtn" onclick="saveTheme()" class="btn primary" style="display:none">Save theme</button>
        <span id="authHint" class="auth-hint" style="margin-left:8px; color:#666;align-items: center;">Log in to preview/save</span>
        <label class="cache-toggle" style="display:none;">
          <input id="cacheToggle" type="checkbox">
          Disable cache
        </label>
        <button id="togglePickersBtn"
                type="button"
                class="btn secondary">
          Show pickers
        </button>
      </div>

      <div id="apiKeyRow" class="api-key-row" style="display:none;">
        <label for="apiKeyInput">Tile API Key</label>
        <input id="apiKeyInput" type="text" readonly>
        <button id="toggleApiKeyBtn" type="button" class="btn secondary">Show</button>
        <span id="apiKeyHint" class="api-key-hint"></span>
      </div>

      <div class="location-row">
        <div class="location-controls">
          <label for="latInput">Lat</label>
          <input id="latInput" class="coordinate-input" type="number" step="any" value="48.692">

          <label for="lonInput">Lon</label>
          <input id="lonInput" class="coordinate-input" type="number" step="any" value="6.184">

          <button onclick="goToLocation()" class="btn secondary">
            Go
          </button>
        </div>

        <div class="zoom-range-controls">
          <label for="zoomFromInput">From</label>
          <input id="zoomFromInput" class="zoom-range-input" type="number" min="3" max="20" value="18">

          <label for="zoomToInput">To</label>
          <input id="zoomToInput" class="zoom-range-input" type="number" min="3" max="20" value="18">

          <button onclick="applyZoomRange()" class="btn secondary">
            Apply
          </button>

          <label for="currentZoomInput">Current</label>
          <input id="currentZoomInput" class="zoom-range-input" type="number" value="18" disabled>
        </div>
      </div>

      <div id="editor" style="display: none;"></div>

      <div class="preview-map">
        <div id="mapPreview"></div>
        <div id="mapLoadingOverlay" class="map-overlay map-loading" hidden>
          <span class="map-spinner" aria-hidden="true"></span>
          <span>Loading tiles</span>
          <span id="mapTileCounter" class="map-tile-counter">0/0</span>
        </div>
        <div id="mapUnauthorizedOverlay" class="map-overlay map-message" hidden>
          <strong>Tile access denied</strong>
          <span>Login or Check the configured tile API key and try again.</span>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>
    <footer>
      Made for CuriooCity Explorer • A magical map adventure for kids • 
      <span id="version"></span>
    </footer>
  <script src="js/main.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
