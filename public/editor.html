<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CuriooCity Theme Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>

<body>
  <div class="page">
    <div class="section">
    <div class="header-row">
      <a class="eyebrow" href="/">
        🗺️ CuriooCity Explorer Tile Gateway
      </a>

      <div id="authBox">
        <a href="/api/login" class="btn secondary login-btn">
          🔐 Login
        </a>
      </div>
    </div>

      <h1>🎨 CuriooCity Theme Editor</h1>

      <p class="lead">Edit map colors, preview them, then save your theme.</p>

      <div class="topbar">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect"></select>
        <button onclick="previewTheme()" class="btn secondary">Preview</button>
        <button onclick="saveTheme()" class="btn primary">Save theme</button>
        <label for="latInput">Lat</label>
        <input id="latInput" type="number" step="any" value="48.692">

        <label for="lonInput">Lon</label>
        <input id="lonInput" type="number" step="any" value="6.184">

        <button onclick="goToLocation()" class="btn secondary">
          Go
        </button>
        <label class="cache-toggle">
          <input id="cacheToggle" type="checkbox">
          Disable cache
        </label>
      </div>

      <div id="editor"></div>

      <div class="preview-map">
        <div id="mapPreview"></div>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>
  <script src="js/editor.js"></script>
</body>
</html>
