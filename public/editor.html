<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CuriooCity Theme Editor</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f3f7ef;
      color: #1f2937;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 18px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    select, button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 15px;
    }

    select {
      background: #eef6ff;
      color: #1e3a8a;
      cursor: pointer;
    }

    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(34,197,94,0.35);
    }

    button:hover {
      transform: translateY(-1px);
    }

    #editor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .color-row label {
      flex: 1;
      font-weight: 700;
      text-transform: capitalize;
    }

    input[type="color"] {
      width: 46px;
      height: 42px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .rgb {
      font-size: 12px;
      color: #6b7280;
      min-width: 78px;
      text-align: right;
    }

    .status {
      margin-top: 18px;
      font-weight: 700;
      color: #16a34a;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h1>🎨 CuriooCity Theme Editor</h1>
      <div class="subtitle">Edit map colors and save your theme.</div>

      <div class="topbar">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect"></select>
        <button onclick="saveTheme()">Save theme</button>
      </div>

      <div id="editor"></div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    let themes = {};
    let currentTheme = "forest";

    function rgbToHex(rgb) {
      return "#" + rgb.map(v => v.toString(16).padStart(2, "0")).join("");
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    async function loadThemes() {
      const res = await fetch("/api/themes");
      themes = await res.json();

      const select = document.getElementById("themeSelect");
      select.innerHTML = "";

      Object.keys(themes).forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });

      select.value = currentTheme;
      renderEditor();
    }

    function renderEditor() {
      currentTheme = document.getElementById("themeSelect").value;
      const theme = themes[currentTheme];
      const editor = document.getElementById("editor");

      editor.innerHTML = "";

      Object.entries(theme).forEach(([key, rgb]) => {
        const row = document.createElement("div");
        row.className = "color-row";

        row.innerHTML = `
          <label>${key}</label>
          <input type="color" value="${rgbToHex(rgb)}" data-key="${key}">
          <span class="rgb">${rgb.join(", ")}</span>
        `;

        row.querySelector("input").addEventListener("input", e => {
          const newRgb = hexToRgb(e.target.value);
          row.querySelector(".rgb").textContent = newRgb.join(", ");
        });

        editor.appendChild(row);
      });
    }

    async function saveTheme() {
      const inputs = document.querySelectorAll("input[type=color]");
      const updated = {};

      inputs.forEach(input => {
        updated[input.dataset.key] = hexToRgb(input.value);
      });

      await fetch(`/api/themes/${currentTheme}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updated),
      });

      document.getElementById("status").textContent = "Theme saved ✅";
      setTimeout(() => {
        document.getElementById("status").textContent = "";
      }, 2000);
    }

    document.getElementById("themeSelect").addEventListener("change", renderEditor);
    loadThemes();
  </script>
</body>
</html>
